<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>SİSTEM ÇÖKTÜ - KAÇIŞ YOK!</title>
<style>
  body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #000; }
  
  /* Tüm ekranı kaplayan çıldırtıcı ışıklar */
  #flashLayer {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: 1; display: none;
  }

  .extreme-flash {
    display: block !important;
    animation: flashLoop 0.04s infinite; /* Işık hızıyla yanıp sönme */
  }

  @keyframes flashLoop {
    0% { background-color: red; }
    33% { background-color: blue; }
    66% { background-color: lime; }
    100% { background-color: red; }
  }

  /* Işık hızıyla dönen görseller */
  .floating-asset {
    position: absolute; z-index: 500; pointer-events: none;
    animation: megaSpin 0.2s linear infinite; /* Daha da hızlı dönüş */
    border: 15px solid white;
  }

  @keyframes megaSpin { 
    0% { transform: rotate(0deg) scale(1.5); }
    100% { transform: rotate(360deg) scale(2); } 
  }

  /* Dev Hata Pencereleri */
  .giant-popup {
    position: absolute; width: 500px; background: #dfdfdf; border: 5px outset #fff;
    padding: 20px; z-index: 1000; font-size: 35px; font-weight: 900;
    color: black; box-shadow: 30px 30px 0px #000; text-align: center;
  }
</style>
</head>
<body onclick="startUltimateChaos()">

<div id="flashLayer"></div>

<!-- EŞEK SESİ -->
<audio id="donkeyAudio" loop>
  <source src="https://soundboard.com" type="audio/mpeg">
</audio>

<!-- KADIN ÇIĞLIĞI -->
<audio id="screamAudio" loop>
  <source src="https://soundboard.com" type="audio/mpeg">
</audio>

<script>
const donkey = document.getElementById("donkeyAudio");
const scream = document.getElementById("screamAudio");
let chaosActive = false;

// Görseller
const tunaImg = "/mnt/data/file_00000000243871fda1bd74fc66952b8b";
const babyImg = "https://bing.com... (Gonderdigin Bebek Resmi)"; 
// Not: Gönderdiğin bebek resmini "input_file_0.png" olarak projeye ekleyebilirsin.
const currentBaby = "input_file_0.png"; 

function startUltimateChaos() {
    if(!chaosActive) {
        donkey.play();
        scream.play(); // Çığlık sesi başlıyor
        chaosActive = true;

        // 1 saniye sonra her şey patlıyor
        setTimeout(() => {
            document.getElementById('flashLayer').classList.add('extreme-flash');
            
            // Her 150ms'de bir (daha hızlı) yeni bir şeyler fırlat
            setInterval(() => {
                createGiantPopup();
                spawnImage(tunaImg, 350); // Tuna
                spawnImage("input_file_0.png", 400); // Gönderdiğin Bebek (Hızlı dönen)
            }, 150); 
        }, 1000);

        if (document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen();
        }
    }
}

function createGiantPopup() {
    const div = document.createElement('div');
    div.className = 'giant-popup';
    div.style.left = Math.random() * 50 + '%';
    div.style.top = Math.random() * 50 + '%';
    div.innerHTML = `
        <div style="background:red;color:white;text-align:left;padding:5px;">WARNING!!!</div>
        <br>AAAAAAA!!!<br>KAPATAMAZSIN!<br><br>
        <button style="width:100%;height:70px;font-size:30px;background:black;color:red;">ÇIKIŞ YOK!</button>
    `;
    document.body.appendChild(div);
}

function spawnImage(src, size) {
    const img = document.createElement('img');
    img.src = src;
    img.className = 'floating-asset';
    img.style.width = size + 'px';
    img.style.left = Math.random() * 70 + '%';
    img.style.top = Math.random() * 70 + '%';
    document.body.appendChild(img);
}

window.onbeforeunload = function() { return "ÇIĞLIKLAR SENİ BIRAKMAZ!"; };
</script>

</body>
</html>
